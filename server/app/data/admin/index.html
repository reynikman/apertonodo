<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Apertonodo</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main id="app">
  <section id="login" class="card narrow">
    <h1 data-t="signInTitle"></h1>
    <form id="login-form" autocomplete="on">
      <label><span data-t="username"></span><input id="login-name" name="username" autocomplete="username" required maxlength="128"></label>
      <label><span data-t="password"></span><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button class="primary" type="submit" data-t="signIn"></button>
    </form>
    <p id="login-note" class="note" role="alert"></p>
  </section>

  <div id="panel" hidden>
    <header class="top">
      <h1 data-t="title"></h1>
      <button id="sign-out" type="button" data-t="signOut"></button>
    </header>
    <p id="note" class="note" role="alert"></p>

    <section class="card">
      <h2 data-t="state"></h2>
      <dl id="state" class="facts"></dl>
    </section>

    <section class="card">
      <h2 data-t="people"></h2>
      <div id="people"></div>
      <form id="add-form" class="row-form" autocomplete="off">
        <h3 data-t="addPerson"></h3>
        <label><span data-t="username"></span><input id="add-name" required maxlength="128" autocomplete="off"></label>
        <label class="check"><input id="add-admin" type="checkbox"><span data-t="administrator"></span></label>
        <button class="primary" type="submit" data-t="add"></button>
        <p class="meta" data-t="addHint"></p>
      </form>
      <div id="invite" class="invite" role="status" hidden></div>
    </section>
  </div>
</main>
<script src="/admin/admin.js"></script>
</body>
</html>
