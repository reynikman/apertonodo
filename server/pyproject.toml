[project]
name = "music-stream-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "sentry-sdk[fastapi]>=2.71.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# A test silent for 5 minutes prints every thread's traceback, so a hung CI
# job names its test instead of only hitting the 1-hour runner timeout.
faulthandler_timeout = 300

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Static analysis. Runs from one file: scripts/static_analysis.sh —
# both locally (scripts/check.sh) and in GitLab (job static-analysis).
# ---------------------------------------------------------------------------

[tool.ruff.lint]
# Only what catches defects: syntax (E9), import and name resolution (F),
# explicit write errors (E4, E7). Import order and style are not touched — that is
# foreign noise in review, not a breakage. Widening the set goes in a separate MR, together with
# fixing whatever it finds.
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
# Server code only. mypy does not look at the tests: they already run in full,
# and two paths to one file (tests.test_x and test_x) are beyond it to resolve.
files = ["app"]

[[tool.mypy.overrides]]
# This library has no types from its own authors. Only they are silenced, by
# name, not everything: a global ignore_missing_imports would hide a real
# import breakage too, and a "clean" report would stop meaning anything.
module = ["asyncpg.*"]
ignore_missing_imports = true
