# The build runs in CI on a server shared with other services; the job has a 6 GB ceiling.
# The Flutter template gave Gradle an 8 GB heap and 4 GB of metaspace, and on 03.10 an
# APK build took 9.7 GB: the server ran out of memory and the service answered 502 for
# 1.5 h (docs/troubleshooting.md no. 65). Kotlin compiles inside Gradle rather than
# in a separate process with a heap of the same size.
# On 12-13 Oct the CI job ceiling (6 GB) killed the Gradle daemon three times:
# a 4 GB heap + 1 GB metaspace + 0.5 GB code cache is 5.5 of 6 already, and the
# Dart compiler runs next to it.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
